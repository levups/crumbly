name: Feature request
description: A trail GretelX cannot express or derive yet, a case gretelx-convert misses
body:
  - type: textarea
    id: need
    attributes:
      label: What you need
      description: The pages and trail you are trying to produce, and what stops you today.
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: How you would write it
      description: The breadcrumbs class or view call you would like to write.
      render: ruby
